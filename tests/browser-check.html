<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Jura responsive browser checks</title>
  <style>
    body{font:14px system-ui;margin:16px;background:#f5f7f6;color:#172d36}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{padding:8px 12px;cursor:pointer}
    button[aria-pressed=true]{background:#174e48;color:white}iframe{display:block;width:390px;height:844px;border:1px solid #c7d8d4;background:white}
  </style>
</head>
<body>
  <h1>Responsive browser checks</h1>
  <p>This frame loads the real published pages at a controlled viewport width. It checks responsive layout and interactions, not native Safari, hardware or touch gestures.</p>
  <nav aria-label="Test viewport">
    <button type="button" data-width="390" aria-pressed="true">Phone 390</button>
    <button type="button" data-width="768" aria-pressed="false">Tablet 768</button>
    <button type="button" data-width="1440" aria-pressed="false">Desktop 1440</button>
  </nav>
  <nav aria-label="Test page">
    <button type="button" data-page="index.html" aria-pressed="true">Startplätze</button>
    <button type="button" data-page="karte.html" aria-pressed="false">Map</button>
  </nav>
  <iframe id="site" title="Published Jura website" src="../index.html?release=20261021-1"></iframe>
  <script>
    const frame=document.getElementById('site');
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
      frame.style.width=button.dataset.width+'px';
      document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
    }));
    document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{
      frame.src='../'+button.dataset.page+'?release=20261021-1';
      document.querySelectorAll('[data-page]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
    }));
  </script>
</body>
</html>
